# Metadata about this component, to be used in the CMS
spec:
  structures:
    - content_blocks
  label: Meet The Team
  description: A section showcasing team members with their roles and social links.
  icon: 'group'
  tags:
    - Team
    - Profile

# Defines the structure of this component, as well as the default values
blueprint:
  title: Our Expert Team
  topper: Meet Our Team
  description: >-
    Meet our dedicated team of professionals who are passionate about what they do.
  team_members:
    - name: Doctor Gill
      job_title: Doctor
      description: Dr. Gill, originally from the Philippines, moved to Edmonton with her family at the age of six. She pursued her undergraduate studies at the University of Saskatchewan...
      read_more_url: /team-members/dr-gill/
    - name:  Dr Easwaran
      job_title: Doctor
      description: Dr. Easwaran moved to Canada in 2003 and completed Masters in Vision Science from University of Waterloo in 2005... 
      read_more_url: /team-members/dr-easwaran/

# Overrides any fields in the blueprint when viewing this component in the component browser
preview:

# Any extra CloudCannon inputs configuration to apply to the blueprint
_inputs:
  title:
    type: text
    label: Title
    options:
      preview:
        icon: 'short_text'
  topper:
    type: text
    label: Topper
    options:
      preview:
        icon: 'short_text'
  description:
    type: textarea
    label: Description
    options:
      preview:
        icon: 'subject'
  team_members:
    type: group
    label: Team Members
    options:
      preview:
        icon: 'person'
    fields:
      - name: name
        type: text
        label: Name
      - name: job_title
        type: text
        label: Job Title
      - name: description
        type: textarea
        label: Description
      - name: read_more_url
        type: url
        label: Read More URL
